<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Radiant Metallic Gold Gradient -->
    <linearGradient id="goldLuster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C8"/>
      <stop offset="25%" stop-color="#F3D17A"/>
      <stop offset="65%" stop-color="#D4A745"/>
      <stop offset="100%" stop-color="#8F681E"/>
    </linearGradient>

    <!-- Highlight Edge for Gold Rim -->
    <linearGradient id="rimGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#D4A745"/>
      <stop offset="100%" stop-color="#735010"/>
    </linearGradient>

    <!-- Deep Luxury Leather Obsidian/Espresso Background -->
    <linearGradient id="leatherBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28160C"/>
      <stop offset="45%" stop-color="#150B05"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>

    <!-- Subtle Inner Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#F3D17A" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#C59B4E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <style>
      .fav-stroke-bold {
        stroke: url(#goldLuster);
        stroke-width: 90;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .fav-stroke-med {
        stroke: url(#goldLuster);
        stroke-width: 75;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .fav-shield-solid {
        fill: url(#goldLuster);
        stroke: url(#goldLuster);
        stroke-width: 30;
        stroke-linejoin: round;
      }
      .fav-horn-fill {
        fill: #D4A745;
        fill-opacity: 0.35;
        stroke: url(#goldLuster);
        stroke-width: 70;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fav-nostril-accent {
        fill: #080402;
        stroke: url(#goldLuster);
        stroke-width: 40;
      }
    </style>
  </defs>

  <!-- Luxury Medallion Container: Deep Leather Squircle with Gold Border -->
  <rect x="14" y="14" width="484" height="484" rx="112" ry="112" fill="url(#leatherBg)" stroke="url(#rimGold)" stroke-width="18"/>
  <rect x="28" y="28" width="456" height="456" rx="98" ry="98" fill="none" stroke="#F3D17A" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Ambient Glow Behind Crest -->
  <circle cx="256" cy="256" r="215" fill="url(#centerGlow)"/>

